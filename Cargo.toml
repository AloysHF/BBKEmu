[workspace]
members = [
    "crates/bbkemu-core",
    "crates/bbkemu",
    "crates/bbkemu-libretro",
    "crates/bbkemu-rom-analyzer",
]
default-members = ["crates/bbkemu-libretro"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/AloysHF/BBKEmu"

[workspace.dependencies]
# CPU emulator
mos6502 = "0.10"

# Serialization (save states)
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# Image processing (screenshot)
image = { version = "0.25", default-features = false, features = ["png"] }

# Standalone frontend
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
clap = { version = "4", features = ["derive"] }
capstone = "0.14"

[profile.release]
opt-level = 3
lto = true
strip = true
