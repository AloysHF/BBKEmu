[package]
name = "bbkemu-libretro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BBK electronic dictionary game emulator - libretro core"

[lib]
name = "bbkemu"
# `staticlib` is only consumed by the EmulatorJS build, which links the core
# into the wasm frontend; native builds keep producing the cdylib.
crate-type = ["cdylib", "staticlib"]

[dependencies]
bbkemu-core = { path = "../bbkemu-core" }
log = { workspace = true }
