name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Redeploy once the rolling nightly release contains the EmulatorJS core.
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      core_ready: ${{ steps.core.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fetch EmulatorJS runtime
        env:
          EJS_VERSION: "4.2.3"
        run: |
          EJS_DATA="https://cdn.emulatorjs.org/${EJS_VERSION}/data"
          mkdir -p site/data/compression
          curl -fsSL "$EJS_DATA/loader.js" -o site/data/loader.js
          curl -fsSL "$EJS_DATA/emulator.min.zip" -o "$RUNNER_TEMP/emulatorjs-runtime.zip"
          unzip -oq "$RUNNER_TEMP/emulatorjs-runtime.zip" -d site/data
          # emulator.min.zip only carries the JS/CSS bundles. EmulatorJS loads
          # these on demand, so without them the core .data archive fails with
          # "Network Error".
          curl -fsSL "$EJS_DATA/compression/extract7z.js" -o site/data/compression/extract7z.js
          curl -fsSL "$EJS_DATA/compression/extractzip.js" -o site/data/compression/extractzip.js
          # The play page asks EmulatorJS for zh-CN; the runtime archive does
          # not carry any localization files, so fetch the one we advertise.
          mkdir -p site/data/localization
          curl -fsSL "$EJS_DATA/localization/zh-CN.json" -o site/data/localization/zh-CN.json

      - name: Fetch BBKEmu EmulatorJS core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data/cores/reports
          if gh release download nightly-build --repo "$GITHUB_REPOSITORY" \
               --pattern bbkemu-emulatorjs.zip --dir "$RUNNER_TEMP" --clobber; then
            unzip -oq "$RUNNER_TEMP/bbkemu-emulatorjs.zip" -d "$RUNNER_TEMP/ejs-core"
            cp "$RUNNER_TEMP/ejs-core/cores/"*.data site/data/cores/
            cp "$RUNNER_TEMP/ejs-core/cores/reports/"*.json site/data/cores/reports/
            for name in bbkemu-wasm.data bbkemu-legacy-wasm.data; do
              if [ ! -f "site/data/cores/$name" ]; then
                echo "::error::The EmulatorJS zip is missing cores/$name; refusing to deploy a play page without a working core."
                exit 1
              fi
            done
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # Deploying now would publish a play page whose core is missing
            # (the nightly build for this commit has not finished yet). Leave
            # the previous deployment in place and let the Nightly Build
            # completion trigger redeploy with the core.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The nightly-build release has no EmulatorJS core yet; keeping the current Pages deployment."
          fi

      - name: Prepare deployment directory
        if: steps.core.outputs.ready == 'true'
        run: |
          # Copy site files to repo root for deployment
          cp -r site/* .
          # Disable Jekyll processing
          touch .nojekyll

      - name: Upload artifact
        if: steps.core.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: |
      needs.build.outputs.core_ready == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
