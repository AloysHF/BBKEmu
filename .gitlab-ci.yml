# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This recipe is consumed by the Libretro buildbot so the BBKEmu core can
# be distributed through RetroArch's Online Updater > Core Downloader.
#
# BBKEmu is written in Rust, so it uses the official Rust CI templates from
# libretro-infrastructure/ci-templates. Those templates run
# `cargo build --release --target <triple>` and rename the produced cdylib to
# `${CORENAME}_libretro.<ext>`. The cdylib lib target is named `bbkemu`
# (see crates/bbkemu-libretro/Cargo.toml) and the workspace `default-members`
# is set to the libretro core, so the bare cargo build only builds the core.

# Core definitions
.core-defs:
  variables:
    CORENAME: bbkemu

include:
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-x64.yml'

  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-i686.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-x64.yml'

  # Linux 32-bit
libretro-build-linux-i686:
  extends:
    - .libretro-rust-linux-i686-default
    - .core-defs

# Linux aarch64
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-aarch64.yml'

  # macOS/iOS/tvOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-apple.yml'

  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-android-jni.yml'

  # webOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-webos.yml'

stages:
  - build-prepare
  - build-shared
  - build-static

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-rust-windows-x64-default
    - .core-defs

# Windows 32-bit
# Not the official template: the image's i686 mingw is the SJLJ flavour, while
# rustc's i686-pc-windows-gnu std unwinds with DWARF, so libgcc has no
# _Unwind_Resume for it and the link ends there. The earlier nightly
# -Z build-std workaround no longer links either: current std asks for
# -lsynchronization, which the image's mingw-w64 runtime does not ship.
# llvm-mingw carries a libunwind that does - stood in as libgcc_eh - plus an
# empty libgcc for the -lgcc the same link line asks for. dlltool still has to
# be the GNU one; rustc calls it itself for raw-dylib and llvm-dlltool does not
# stand in. Same recipe as holani-retro, green on the current image.
libretro-build-windows-i686:
  extends:
    - .libretro-rust-windows-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-pc-windows-gnu
    LLVM_MINGW: llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64
    STRIP: /opt/llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64/bin/llvm-strip
    CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: /opt/llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64/bin/i686-w64-mingw32-clang
    CARGO_TARGET_I686_PC_WINDOWS_GNU_RUSTFLAGS: -L /opt/gcc-stub
  before_script:
    - apt-get update -qy && apt-get install -yq binutils-mingw-w64-i686
    - curl -sSL -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20230320/$LLVM_MINGW.tar.xz"
    - tar xJf /tmp/llvm-mingw.tar.xz -C /opt
    - mkdir -p /opt/gcc-stub
    - /opt/$LLVM_MINGW/bin/llvm-ar crs /opt/gcc-stub/libgcc.a
    - cp /opt/$LLVM_MINGW/i686-w64-mingw32/lib/libunwind.a /opt/gcc-stub/libgcc_eh.a
    - rustup target add ${TARGET_ARCH}

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-rust-linux-x64-default
    - .core-defs

# Linux 32-bit
# Same image and template as the x64 job, only the target changes: the image
# already carries gcc-multilib, so all this needs is the rustup target. The
# official template instead names i686-linux-gnu-gcc as the linker, which the
# rust build image does not carry - the job ends in "linker
# `i686-linux-gnu-gcc` not found".
libretro-build-linux-i686:
  extends:
    - .libretro-rust-linux-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-unknown-linux-gnu
  before_script:
    - rustup target add ${TARGET_ARCH}

# Linux aarch64
libretro-build-linux-aarch64:
  extends:
    - .libretro-rust-linux-aarch64-default
    - .core-defs

# macOS 64-bit
libretro-build-osx-x64:
  extends:
    - .libretro-rust-osx-x86_64-default
    - .core-defs

# macOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-rust-osx-arm64-default
    - .core-defs

# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-rust-android-jni-armeabi-v7a
    - .core-defs

# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-rust-android-jni-arm64-v8a
    - .core-defs

# Android 64-bit x86
android-x86_64:
  extends:
    - .libretro-rust-android-jni-x86_64
    - .core-defs

# Android 32-bit x86
android-x86:
  extends:
    - .libretro-rust-android-jni-x86
    - .core-defs

# iOS
libretro-build-ios-arm64:
  extends:
    - .libretro-rust-ios-arm64-default
    - .core-defs

# tvOS
libretro-build-tvos-arm64:
  extends:
    - .libretro-rust-tvos-arm64-default
    - .core-defs

# webOS
libretro-build-webos-armv7a:
  extends:
    - .libretro-rust-webos-armv7a-default
    - .core-defs
